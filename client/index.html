<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #101418;
        color: #e8eef4;
        font: 14px/1.4 system-ui, sans-serif;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 10px;
        max-width: 460px;
        white-space: pre-line;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
      #home {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        height: 100%;
      }
      #home h1 {
        margin: 0 0 16px;
        font-size: 48px;
        letter-spacing: 0.1em;
      }
      #home .play {
        width: 220px;
        padding: 14px 0;
        border: 1px solid #3a4652;
        border-radius: 8px;
        background: #1c242c;
        color: inherit;
        font-size: 18px;
        text-align: center;
        text-decoration: none;
      }
      #home .play:hover,
      #home .play:focus-visible {
        background: #2a3642;
        border-color: #6b8299;
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
