$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
toolchains:
  default: 'system'

tasks:
  dev:
    description: 'Build the predictor and serve the client'
    command: 'bun run dev'
    preset: 'server'
  build:
    description: 'Build the predictor and the client'
    command: 'bun run build'
    options:
      cache: false
  test:
    description: 'Client tests'
    command: 'bun run test'
    options:
      cache: false
  typecheck:
    description: 'Type-check the client'
    command: 'bun run typecheck'
    options:
      cache: false
